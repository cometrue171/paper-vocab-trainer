<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e7e5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>背单词 · Science English</title>
<link rel="stylesheet" href="static/app.css?v=8">
<style>
/* 背单词：自然流布局 + 答题栏吸附在底部导航栏上方 */
.recite{margin:12px auto;padding:0;display:flex;flex-direction:column}
.face-wrap{flex:1 1 auto;padding:22px 18px 14px}
.face-front{min-height:38vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.wfront{font-size:clamp(36px,9vw,56px);font-weight:700;letter-spacing:.5px;margin:8px 0 18px;word-break:break-word}
.audio{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.audio .btn{min-width:118px;min-height:46px;font-size:16px}
.gloss{font-size:17px;line-height:1.7;color:#22303f}
.phono{color:#7a4fd0;font-weight:600;font-size:16px}
.sentence{margin:10px 0;font-size:16px;line-height:1.8}
.sentence mark{background:#ffe08a;padding:0 2px;border-radius:3px}
.paper{color:var(--muted);font-size:12px}
.dock{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      box-shadow:0 -4px 10px rgba(0,0,0,.05)}
.dock .row{gap:8px;margin-top:8px}
.dock .row .btn{flex:1;min-height:50px;font-size:16px}
.mininav{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.mininav button{min-height:34px;padding:4px 12px;font-size:13px;flex:none}
@media (max-width:760px){ .dock{bottom:66px} }   /* 停在底部导航栏上方 */
.checktip{font-size:14px;color:#7a5a10;background:#fff6df;border:1px solid #f3ddae;border-radius:8px;padding:8px 12px;margin:10px 0}
.err{margin:20px;padding:14px;background:#fdf0ef;border:1px solid #f0c4be;border-radius:10px;color:#a33;font-size:13px}
.empty{margin:24px auto;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Science English<small>背单词</small></div>
  <nav class="nav"></nav>
</div>
<div class="wrap">
  <div id="err" class="err" style="display:none"></div>
  <div class="card recite" id="cardBox"></div>
  <div class="card recite" id="done" style="display:none">
    <div class="empty">
      <h2>🌿 本组背完</h2>
      <p class="muted">新词与到期复习会自动排入后续学习，保持节奏即可。</p>
      <button class="btn primary" onclick="location.reload()">再来一组</button>
    </div>
  </div>
</div>
<nav class="nav bnav"></nav>
<script src="static/app.js?v=8"></script>
<script>
navBar('index.html');
let queue = [], pos = 0, cur = 0;
const answered = new Set();

function showErr(e) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '页面出错了：' + (e && (e.message || e)) + '（刷新重试；若仍不行请把这段文字发给维护者）';
}

async function start() {
  const q = await api('/api/queue');
  queue = q.new.concat(q.due);
  if (!queue.length) { done.style.display = 'flex'; return; }
  showCard(0);
}
function card() { return queue[pos]; }

/* 释义+例句正文（显示释义 / 我认识自检 共用） */
function faceHTML(c) {
  const ctxs = c.contexts.map(x => `
    <div class="sentence">${highlight(c.word, x.sentence)}
      <div class="paper">—— ${x.paper_title || '文献'}</div>
    </div>`).join('');
  return `
    <div class="face-wrap">
      <div class="gloss">
        ${c.phonetic ? `<span class="phono">/${c.phonetic.replace(/^[/]|[/]$/g, '')}/</span>&nbsp; ` : ''}${c.gloss || '<span class="muted">暂无释义</span>'}
      </div>
      ${ctxs}
    </div>`;
}
function dockNav(c, extra) {
  const hasNext = pos < cur && cur < queue.length;
  return `
    <div class="mininav">
      <button class="btn ghost" ${pos === 0 ? 'disabled style="opacity:.4"' : ''} onclick="back()">← 上一张</button>
      <span>${pos + 1} / ${queue.length}</span>
      ${extra.next || '<span></span>'}
    </div>${extra.body}`;
}

function showCard(i) {
  pos = Math.max(0, Math.min(i, queue.length - 1));
  const c = card();
  (answered.has(c.word_id) ? renderBack : renderFront)(c);
}

function renderFront(c) {
  cardBox.innerHTML = `
    <div class="face-wrap face-front">
      <div class="wfront">${c.word}</div>
      <div class="audio">
        <button class="btn" onclick="playWord('${c.word}',1)">🇬🇧 英音</button>
        <button class="btn" onclick="playWord('${c.word}',2)">🇺🇸 美音</button>
      </div>
    </div>
    <div class="dock">${dockNav(c, { body: `
      <div class="row">
        <button class="btn" onclick="reveal()">显示释义</button>
        <button class="btn primary" onclick="check()">我认识 · 自检</button>
      </div>` })}
    </div>`;
}

function reveal() { renderBack(card()); }
function renderBack(c) {
  cardBox.innerHTML = faceHTML(c) + `
    <div class="dock">${dockNav(c, { body: `
      <div class="row">
        <button class="btn danger" onclick="grade(0)">忘记</button>
        <button class="btn amber" onclick="grade(1)">模糊</button>
        <button class="btn primary" onclick="grade(2)">记得</button>
      </div>` })}
    </div>`;
}

/* 我认识：先给出释义，让你核对是否真认识 */
function check() { renderCheck(card()); }
function renderCheck(c) {
  cardBox.innerHTML = faceHTML(c) + `
    <div class="checktip">对照上面的意思核对一下——你刚才说的“认识”对上了吗？</div>
    <div class="dock">${dockNav(c, { body: `
      <div class="row">
        <button class="btn danger" onclick="confirmKnow(false)">❌ 记错了（重新学）</button>
        <button class="btn primary" onclick="confirmKnow(true)">✅ 确实认识</button>
      </div>` })}
    </div>`;
}

function back() { if (pos > 0) showCard(pos - 1); }
function skipNext() { if (cur < queue.length) showCard(cur); else finish(); }

function firstTime(c) {
  if (answered.has(c.word_id)) return false;
  answered.add(c.word_id);
  cur = Math.max(cur, pos + 1);
  return true;
}
function grade(g) {
  const c = card();
  const first = firstTime(c);
  api('/api/review', { method: 'POST', body: { word_id: c.word_id, grade: g } })
    .then(() => first ? goNext() : goCurrent())
    .catch(showErr);
}
function confirmKnow(ok) {
  const c = card();
  const first = firstTime(c);
  const p = ok
    ? api('/api/known', { method: 'POST', body: { word_id: c.word_id } })
    : api('/api/review', { method: 'POST', body: { word_id: c.word_id, grade: 0 } });
  p.then(() => first ? goNext() : goCurrent()).catch(showErr);
}
function goCurrent() { if (cur < queue.length) showCard(cur); else finish(); }
function goNext() {
  if (pos + 1 < queue.length && pos + 1 >= cur) { showCard(pos + 1); return; }
  goCurrent();
}
function finish() { cardBox.innerHTML = ''; done.style.display = 'flex'; }
start().catch(showErr);
</script>
</body>
</html>
