[project]
name = "science-english"
version = "0.1.0"
description = "Turn research papers into a personal vocabulary trainer (OpenAlex + ECDICT + SM-2)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "fonttools>=4.64.0",
    "pypdf>=6.18.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
