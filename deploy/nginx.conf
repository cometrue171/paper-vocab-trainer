# Reverse-proxy sample: serve Science English under https://example.com/english/
# The app is expected to listen on 127.0.0.1:8013 and keep its own session login.
location = /english {
    return 301 /english/;
}

location /english/ {
    client_max_body_size 150m;      # PDF uploads
    proxy_pass http://127.0.0.1:8013/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
